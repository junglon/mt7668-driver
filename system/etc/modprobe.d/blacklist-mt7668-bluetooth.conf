# Blacklist upstream MediaTek SDIO Bluetooth drivers
# On Amlogic TV boxes (e.g., ZTE B860H V5), the MT7668 combo chip's SDIO Bluetooth
# function causes kernel timeouts and firmware query failures (-110) with the upstream
# btmtksdio driver. Blacklisting these modules prevents dmesg log spam and avoids bus stalls.
blacklist btmtksdio
blacklist btmtk
